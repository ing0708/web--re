<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" width="520" height="640" role="img" aria-label="BIG ONE Electric amber LED rotary warning light">
  <defs>
    <!-- Amber dome glass -->
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#C26A00"/>
      <stop offset="14%" stop-color="#F59A12"/>
      <stop offset="34%" stop-color="#FFC04A"/>
      <stop offset="50%" stop-color="#FFD56E"/>
      <stop offset="66%" stop-color="#FFB732"/>
      <stop offset="86%" stop-color="#E8860C"/>
      <stop offset="100%" stop-color="#B25E00"/>
    </linearGradient>
    <linearGradient id="domeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE39A"/>
      <stop offset="55%" stop-color="#FFC24E"/>
      <stop offset="100%" stop-color="#F0A21E"/>
    </linearGradient>
    <!-- Chrome ring -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#7C8794"/>
      <stop offset="18%" stop-color="#E8EEF3"/>
      <stop offset="34%" stop-color="#AEB9C4"/>
      <stop offset="50%" stop-color="#F4F8FB"/>
      <stop offset="66%" stop-color="#9AA6B2"/>
      <stop offset="84%" stop-color="#E2E9EF"/>
      <stop offset="100%" stop-color="#6E7884"/>
    </linearGradient>
    <!-- Yellow base -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#C98A00"/>
      <stop offset="20%" stop-color="#F6B919"/>
      <stop offset="50%" stop-color="#FFD24A"/>
      <stop offset="80%" stop-color="#F0AE10"/>
      <stop offset="100%" stop-color="#B87C00"/>
    </linearGradient>
    <radialGradient id="rib" cx="0.5" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== Dome (fluted amber glass) ===== -->
  <g>
    <!-- main body of dome -->
    <path d="M150 150
             C150 96 196 70 260 70
             C324 70 370 96 370 150
             L370 360
             L150 360 Z" fill="url(#dome)"/>
    <!-- rounded crown highlight -->
    <path d="M150 150
             C150 96 196 70 260 70
             C324 70 370 96 370 150
             L370 196
             C300 176 220 176 150 196 Z" fill="url(#domeTop)" opacity="0.9"/>

    <!-- vertical flutes / ribs -->
    <g stroke="#9A5A00" stroke-opacity="0.30" stroke-width="2">
      <line x1="180" y1="150" x2="180" y2="356"/>
      <line x1="205" y1="135" x2="205" y2="356"/>
      <line x1="230" y1="128" x2="230" y2="356"/>
      <line x1="260" y1="125" x2="260" y2="356"/>
      <line x1="290" y1="128" x2="290" y2="356"/>
      <line x1="315" y1="135" x2="315" y2="356"/>
      <line x1="340" y1="150" x2="340" y2="356"/>
    </g>
    <!-- soft inner LED column hints (kept subtle) -->
    <g fill="#8A4E00" opacity="0.18">
      <rect x="244" y="180" width="6" height="150" rx="3"/>
      <rect x="270" y="180" width="6" height="150" rx="3"/>
    </g>
    <!-- specular highlight band -->
    <path d="M196 110 C210 96 232 90 250 92 L236 350 L206 350 Z" fill="url(#rib)"/>
  </g>

  <!-- ===== Chrome ring ===== -->
  <rect x="138" y="356" width="244" height="46" rx="10" fill="url(#chrome)"/>
  <rect x="138" y="356" width="244" height="10" rx="5" fill="#ffffff" opacity="0.55"/>
  <rect x="138" y="392" width="244" height="6" rx="3" fill="#5d6670" opacity="0.5"/>

  <!-- ===== Yellow base ===== -->
  <path d="M150 398
           L150 540
           C150 556 168 566 196 566
           L324 566
           C352 566 370 556 370 540
           L370 398 Z" fill="url(#base)"/>
  <path d="M150 398 L370 398 L370 412 C300 404 220 404 150 412 Z" fill="#ffffff" opacity="0.25"/>

  <!-- ROTARY WARNING LIGHT label (red-bordered white) -->
  <g>
    <rect x="166" y="438" width="118" height="74" rx="5" fill="#ffffff" stroke="#D81E1E" stroke-width="2.5"/>
    <text x="225" y="455" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#101010" text-anchor="middle" letter-spacing="0.3">ROTARY WARNING LIGHT</text>
    <rect x="174" y="461" width="102" height="16" rx="2" fill="#ffffff" stroke="#D81E1E" stroke-width="1.4"/>
    <text x="225" y="473" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#D81E1E" text-anchor="middle">No.2</text>
    <text x="225" y="488" font-family="Arial, sans-serif" font-size="6.6" font-weight="600" fill="#101010" text-anchor="middle">VOLTAGE: AC 220V  BULB: LED</text>
    <text x="225" y="505" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#0B2E6B" text-anchor="middle">BIG ONE <tspan font-size="7" font-weight="600" fill="#101010">ELECTRIC</tspan></text>
  </g>

  <!-- LED Running label (yellow) -->
  <g>
    <rect x="296" y="446" width="58" height="56" rx="4" fill="#F7C800" stroke="#C99F00" stroke-width="1"/>
    <text x="325" y="468" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" fill="#101010" text-anchor="middle">LED</text>
    <text x="325" y="484" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#101010" text-anchor="middle">Running</text>
    <line x1="303" y1="488" x2="347" y2="488" stroke="#101010" stroke-width="0.8"/>
    <text x="325" y="498" font-family="'Noto Sans Thai', Arial, sans-serif" font-size="9" fill="#101010" text-anchor="middle">ไฟวิ่ง</text>
  </g>

  <!-- ===== Mounting studs + lead wires ===== -->
  <g>
    <rect x="206" y="566" width="20" height="26" rx="3" fill="#2b2b2b"/>
    <rect x="294" y="566" width="20" height="26" rx="3" fill="#2b2b2b"/>
    <rect x="210" y="588" width="12" height="22" rx="2" fill="#9aa3ac"/>
    <rect x="298" y="588" width="12" height="22" rx="2" fill="#9aa3ac"/>
    <path d="M216 600 C200 612 240 614 260 606 C280 614 320 612 304 600"
          fill="none" stroke="#1c1c1c" stroke-width="3.4" stroke-linecap="round"/>
  </g>
</svg>
